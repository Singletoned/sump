[project]
name = "sump"
version = "0.1.0"
description = "Record Sentry SDK errors in a machine-local registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["platformdirs>=4.11.8", "sentry-sdk>=2,<3"]

[project.scripts]
sump = "sump.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.16.7"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "I"]
unfixable = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["sump"]
